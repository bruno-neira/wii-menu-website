<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wii.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wii Menu</title>
    <!-- Fonts are self-hosted (see src/index.css). Deliberately no CDN link:
         a network font in the render path causes offline fallback to Helvetica
         and produces phantom diffs in visual regression runs. -->
    <link
      rel="preload"
      href="/fonts/rocknroll-one-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
